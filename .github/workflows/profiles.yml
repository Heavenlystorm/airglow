name: profiles

# Community profiles in profiles/: every pull request that adds or changes one is checked, and once one is merged
# the gallery's index is rebuilt so Airglow sees it.
on:
  push:
    branches: [main]
    paths: ["profiles/**", "airglow/profiles.py", "tools/profiles.py"]
  pull_request:
    paths: ["profiles/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.4.3
      - name: Profiles are valid
        run: python tools/profiles.py --check

  index:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the index dates each profile by its first commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.4.3
      - name: Rebuild profiles/index.json
        run: python tools/profiles.py --index
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- profiles/index.json; then echo "index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles/index.json
          git commit -m "Gallery index"
          git push
