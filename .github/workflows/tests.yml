name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: UI scripts parse
        shell: bash
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Device plugins load
        run: python -c "from airglow import plugins; p = plugins.load(); assert p, 'no device plugins found'; print(len(p), 'device plugins')"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: airglow-setup
          path: dist/Airglow-Setup-*.exe
          if-no-files-found: error
