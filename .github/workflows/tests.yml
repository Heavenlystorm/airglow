name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Every module loads
        # These are imported lazily inside main(), so a syntax error there used to pass every gate and stop the app
        # from opening its window at all.
        run: |
          python -m compileall -q airglow tools run.py
          python -c "import airglow.app, airglow.window, airglow.effecthost, airglow.tray, airglow.api, airglow.controller"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: UI scripts parse
        shell: bash
        run: for f in web/js/*.js web/runtime/*.js tools/*.mjs; do node --check "$f"; done
      - name: UI modules parse and their imports resolve
        # node --check parses as a script and accepts code Chromium rejects; this parses as a browser module and
        # checks every named import against the module it comes from.
        run: node --experimental-vm-modules tools/check-js.mjs
      - name: UI state and effect runtime regressions
        run: node --experimental-vm-modules --test tools/test-overview.mjs tools/test-ui-races.mjs tools/test-ui-state.mjs tools/test-effect-runtime.mjs tools/test-studio-workflow.mjs tools/test-workbenches.mjs tests/test_profile_ui.mjs tests/test_migration_ui.mjs
      - name: Community effects are valid
        run: python tools/effects.py --check
      - name: Gallery profiles are valid
        run: python tools/profiles.py --check
      - name: Device plugins load
        run: python -c "from airglow import plugins; p = plugins.load(); assert p, 'no device plugins found'; print(len(p), 'device plugins')"

  browser:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install chromium
      - name: Browser workflows, responsive layout and theme checks
        env:
          AIRGLOW_BROWSER: chromium
        run: python tools/run-ui-checks.py --output output/browser-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: airglow-browser-checks
          path: output/browser-ci
          if-no-files-found: warn

  build:
    needs: [test, browser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Build
        shell: pwsh
        run: ./build.ps1 -SkipTests
      - uses: actions/upload-artifact@v7
        with:
          name: airglow-setup
          path: dist/releases/*-Setup.exe
          if-no-files-found: error
