name: Airglow 1.17.0 installer qualification
on:
  push:
    branches: [codex/firefly-installer-qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scenario: [detect-setup]
    name: Windows / ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        if: matrix.scenario == 'clean' || matrix.scenario == 'detect-setup'
        with:
          repository: Heavenlystorm/winget-pkgs
          ref: 5bd485821d2d447bf9746bcfb02b467b33e8d80e
          path: manifest-source
          sparse-checkout: manifests/h/Heavenlystorm/Airglow/1.17.0
          persist-credentials: false
      - name: Prepare WinGet on Windows Server
        if: matrix.scenario == 'clean' || matrix.scenario == 'detect-setup'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmd = Get-Command winget.exe -ErrorAction SilentlyContinue
          $version = if ($cmd) { (& $cmd.Source --version).Trim().TrimStart('v') } else { '0.0' }
          Write-Host "Runner WinGet $version"
          if ([version]$version -lt [version]'1.29.380') {
            $dir = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'winget-1.29.380')
            $bundleName = 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
            $depsName = 'DesktopAppInstaller_Dependencies.zip'
            gh release download v1.29.380 -R microsoft/winget-cli -p $bundleName -p $depsName --dir $dir.FullName
            if ($LASTEXITCODE -ne 0) { throw 'WinGet release download failed.' }
            $bundle = Join-Path $dir.FullName $bundleName
            $zip = Join-Path $dir.FullName $depsName
            if ((Get-FileHash $bundle).Hash -ne '65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E' -or
                (Get-FileHash $zip).Hash -ne 'BA875AFE9D190F61218985AC0292A99D1DB710BF93E13C68944CA9D89F0D82D1') { throw 'WinGet asset hash mismatch.' }
            Expand-Archive $zip -DestinationPath $dir.FullName
            $deps = @(Get-ChildItem (Join-Path $dir.FullName x64) -File -Recurse | Where-Object Extension -in '.msix','.appx')
            if (-not $deps) { throw 'No x64 dependencies in the WinGet release.' }
            Add-AppxPackage -Path $bundle -DependencyPath $deps.FullName -ForceApplicationShutdown
          }
      - name: Download and verify published packages
        if: matrix.scenario != 'clean'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          function Get-ReleaseAsset($version,$name,$hash) {
            $dir = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/assets/$version"
            gh release download "v$version" --repo Heavenlystorm/airglow --pattern $name --dir $dir.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not download $name" }
            $path = Join-Path $dir.FullName $name
            if ((Get-FileHash -LiteralPath $path).Hash -ne $hash) { throw "Hash mismatch for $name" }
          }
          if ($env:SCENARIO -eq 'portable') {
            Get-ReleaseAsset '1.17.0' 'Airglow-stable-Portable.zip' 'C4C6A8E5C9DA3A9F39A8A2F84804F88F553F5D9C9AA5EC184E17837E42FC5D4F'
          } else {
            if ($env:SCENARIO -eq 'upgrade') {
              Get-ReleaseAsset '1.16.1' 'Airglow-stable-Setup.exe' '6CFFC0B5B61CC6AAA7F7BA39027118907C9CAD9A0DE63FF69234D8161316AF94'
            }
            Get-ReleaseAsset '1.17.0' 'Airglow-stable-Setup.exe' '525D74214D0D69E07E299E8BB8A09C0D66C0CABFCD217EC37CD3097E9D958980'
          }
      - name: Exercise the packaged application
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          $options = @{Scenario=$env:SCENARIO;Version='1.17.0'}
          switch ($env:SCENARIO) {
            clean { $options.Manifest = 'manifest-source/manifests/h/Heavenlystorm/Airglow/1.17.0' }
            detect-setup {
              $options.Scenario = 'clean'
              $options.Manifest = 'manifest-source/manifests/h/Heavenlystorm/Airglow/1.17.0'
              $installerFile = Join-Path $options.Manifest 'Heavenlystorm.Airglow.installer.yaml'
              $manifestText = Get-Content -LiteralPath $installerFile -Raw
              $manifestText = $manifestText.Replace('UpgradeBehavior: install', "ProductCode: Airglow`nUpgradeBehavior: install")
              [IO.File]::WriteAllText((Resolve-Path $installerFile).Path, $manifestText)
              Write-Host 'Testing the proposed ProductCode from the verified uninstall registry key.'
              $options.Setup = "$env:RUNNER_TEMP/assets/1.17.0/Airglow-stable-Setup.exe"
              $options.DetectExistingSetup = $true
            }
            clean-setup {
              $options.Scenario = 'clean'
              $options.Setup = "$env:RUNNER_TEMP/assets/1.17.0/Airglow-stable-Setup.exe"
            }
            portable { $options.Portable = "$env:RUNNER_TEMP/assets/1.17.0/Airglow-stable-Portable.zip" }
            upgrade {
              $options.Setup = "$env:RUNNER_TEMP/assets/1.17.0/Airglow-stable-Setup.exe"
              $options.PreviousSetup = "$env:RUNNER_TEMP/assets/1.16.1/Airglow-stable-Setup.exe"
              $options.PreviousVersion = '1.16.1'
            }
          }
          ./tools/test-windows-package.ps1 @options
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-1.17.0-${{ matrix.scenario }}-lifecycle
          path: output/installer-smoke
          if-no-files-found: warn
