name: release

# Pushing a version tag builds and publishes a release: v1.6.0 goes to the stable channel, v1.6.0-beta.1 to beta.
# Releases are never built on a laptop. docs/RELEASING.md has the steps around it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VPK_VERSION: "1.2.161"        # keep in step with velopack in requirements.txt

jobs:
  qualification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install chromium
      - name: Qualify the source
        env:
          AIRGLOW_BROWSER: chromium
        run: python -B tools/qualify.py source --output output/source-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: airglow-release-source-checks
          path: output/source-ci
          if-no-files-found: warn

  release:
    needs: qualification
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # whether the optional secrets exist (a step's "if" can't read secrets directly)
      HAS_SCOOP: ${{ secrets.SCOOP_BUCKET_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the version
        id: v
        shell: bash
        run: python tools/release.py check-tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build and pack
        shell: pwsh
        env:
          AIRGLOW_SIGN: ${{ secrets.AIRGLOW_SIGN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:AIRGLOW_SIGN) { "::warning::No signing secret yet, so this release is unsigned." }
          ./build.ps1 -Delta -SkipTests

      - name: Qualify the built package
        run: python -B tools/qualify.py package --output output/package-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: airglow-release-package-checks
          path: output/package-ci
          if-no-files-found: warn

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pre = @(); if ("${{ steps.v.outputs.prerelease }}" -eq "true") { $pre = @("--pre") }
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN `
            --outputDir dist\releases --channel ${{ steps.v.outputs.channel }} --tag $env:GITHUB_REF_NAME `
            --releaseName "Airglow ${{ steps.v.outputs.version }}" --publish --merge @pre
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }

      - name: Scoop bucket
        if: steps.v.outputs.channel == 'stable' && env.HAS_SCOOP == 'true'
        shell: bash
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          zip=$(ls dist/releases/*-Portable.zip | head -1)
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"
          git clone --depth 1 "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/Heavenlystorm/scoop-airglow.git" bucket-repo
          mkdir -p bucket-repo/bucket
          python tools/release.py scoop "$VERSION" "$zip" "$url" > bucket-repo/bucket/airglow.json
          cd bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/airglow.json
          git commit -m "airglow $VERSION"
          git push

  published-installer:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install, open and uninstall the public download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the published release.' }
          $setup = @($release.assets | Where-Object name -like '*-Setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected one published Windows installer.' }
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $setup[0].name --dir published
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published installer.' }
          $path = Join-Path 'published' $setup[0].name
          if (('sha256:' + (Get-FileHash -LiteralPath $path).Hash) -ne $setup[0].digest) { throw 'Published installer checksum differs.' }
          ./tools/test-windows-package.ps1 -Scenario clean -Version $env:GITHUB_REF_NAME.Substring(1) -Setup $path
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: airglow-published-installer
          path: output/installer-smoke
          if-no-files-found: warn

  winget:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    continue-on-error: true
    env:
      HAS_WINGET: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Check initial catalog submission
        id: listing
        if: env.HAS_WINGET == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/h/Heavenlystorm/Airglow'
          $response = Invoke-WebRequest -Uri $uri -Headers @{Authorization="Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            Write-Output '::notice::First WinGet submission is awaiting review. After it merges, rerun only this job to submit this published version.'
          } elseif ($response.StatusCode -eq 200) {
            'available=true' >> $env:GITHUB_OUTPUT
          } else { throw "WinGet repository returned HTTP $($response.StatusCode)" }
      - name: Submit the published installer
        if: steps.listing.outputs.available == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Heavenlystorm.Airglow
          installers-regex: '-Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
