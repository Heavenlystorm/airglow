<!doctype html>
<meta charset="utf-8">
<title>Lava lamp</title>
<meta name="airglow-effect" content="1">
<meta name="author" content="heavenlystorm">
<meta name="description" content="Big soft blobs of colour rising and sinking, drawn on the canvas.">
<meta name="license" content="MIT">
<meta name="tags" content="calm, warm">
<meta property="speed" label="Speed" type="number" min="0.1" max="3" step="0.1" default="0.6">
<meta property="color" label="Blob colour" type="color" default="#ff3a6e">
<meta property="background" label="Background" type="color" default="#14002a">

<script>
// Five soft blobs drift up and down; LEDs take the colour under them.
airglow.effect({
  render(ctx, frame) {
    const g = ctx.canvas.getContext("2d");
    const t = frame.time * ctx.params.speed;
    g.globalCompositeOperation = "source-over";
    g.fillStyle = ctx.params.background;
    g.fillRect(0, 0, ctx.width, ctx.height);
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 5; i++) {
      const x = ctx.width * (0.15 + 0.7 * ((i * 0.37) % 1));
      const y = ctx.height * (0.5 + 0.42 * Math.sin(t * (0.5 + i * 0.13) + i * 2.1));
      const r = 55 + 25 * Math.sin(t * 0.7 + i);
      const blob = g.createRadialGradient(x, y, 0, x, y, r);
      blob.addColorStop(0, ctx.params.color);
      blob.addColorStop(1, "transparent");
      g.fillStyle = blob;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
  },
});
</script>
