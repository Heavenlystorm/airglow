[workspace]
resolver = "2"
members = [
    "crates/airglow-core",
    "crates/airglow-ui",
]

[workspace.package]
version = "2.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
hidapi = "2.6"
iced = { version = "0.14", features = ["canvas", "tokio", "image", "advanced"] }
muda = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35"
tokio = { version = "1.52", features = ["full"] }
tray-icon = "0.27"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
