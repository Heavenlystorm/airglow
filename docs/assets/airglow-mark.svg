<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Airglow horizon brand mark">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2440" />
      <stop offset="100%" stop-color="#171222" />
    </linearGradient>

    <linearGradient id="inner-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E4" stop-opacity="0.16" />
      <stop offset="35%" stop-color="#FFF4E4" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="ambient-glow" cx="50%" cy="64%" r="48%">
      <stop offset="0%" stop-color="#FFC38B" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#F48FB1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2E2440" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="arc-grad" x1="20" y1="0" x2="108" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F48FB1" />
      <stop offset="50%" stop-color="#FFC38B" />
      <stop offset="100%" stop-color="#A5DECE" />
    </linearGradient>

    <filter id="arc-glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>

    <clipPath id="squircle-clip">
      <rect x="4" y="4" width="120" height="120" rx="28" ry="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle-clip)">
    <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg-grad)" />
    <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#ambient-glow)" />
    <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#inner-highlight)" />

    <path
      d="M 23.4 75.1 A 42 42 0 0 1 104.6 75.1"
      fill="none"
      stroke="url(#arc-grad)"
      stroke-width="11"
      stroke-linecap="round"
      opacity="0.6"
      filter="url(#arc-glow)"
    />

    <path
      d="M 23.4 75.1 A 42 42 0 0 1 104.6 75.1"
      fill="none"
      stroke="url(#arc-grad)"
      stroke-width="7.5"
      stroke-linecap="round"
    />

    <path d="M 42 86 A 22 22 0 0 1 86 86 Z" fill="#FFF4E4" />

    <line
      x1="20"
      y1="86"
      x2="108"
      y2="86"
      stroke="#FFF4E4"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>

  <rect
    x="4.75"
    y="4.75"
    width="118.5"
    height="118.5"
    rx="27.25"
    ry="27.25"
    fill="none"
    stroke="#62536D"
    stroke-opacity="0.65"
    stroke-width="1.5"
  />
</svg>
